server {
  listen 80;
  root /usr/share/nginx/html;

  # Docker's DNS, re-resolved every 10 s: a recreated (or scaled) api container gets a new IP,
  # and a plain "proxy_pass http://api:3000" would keep the address resolved at startup
  resolver 127.0.0.11 valid=10s ipv6=off;

  # The front calls /api/*: same origin, so no CORS. "/api/" is stripped before the API.
  location /api/ {
    set $api http://api:3000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed build files never change: cache for a year
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Single page app: unknown paths (/extrato, /mercado...) serve index.html
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
